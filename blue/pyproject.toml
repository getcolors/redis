[project]
name = "package-redis-blue"
version = "0.1.0"
description = "Blue/Python implementation of the Redis package"
requires-python = ">=3.11"
dependencies = [
    "blue",
    "colors-compute-blue",
]

# The blue pin is the one colors-compute expects at its own pin, so the two
# git requirements agree and no override is needed; this package does not
# depend on ONCE.
[tool.uv.sources]
blue = { git = "https://github.com/getcolors/blue.git", rev = "290f313ead5ca162875c33a049c880da017eae09" }
colors-compute-blue = { git = "https://github.com/getcolors/colors-compute.git", subdirectory = "blue", rev = "09ec539e75dc21c4dafb019eb8f9da276e695f6f" }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/package_redis_blue"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
