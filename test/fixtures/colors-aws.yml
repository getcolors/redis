# AWS keygen-mode fixture with a managed backup bucket and a managed S3 state
# backend: no aws-ssh-authorized-keys, so the package owns the keypair; the
# storage stage owns the bucket and the scoped pair that writes it.
profile: redis-aws-fixture
workdir: WORKDIR
provider-compute: aws
provider-backend: s3
compute-prevent-destroy: true
redis-image: docker.io/library/redis:7.2.16@sha256:74566c6910d13ae61e7ce73ebd3127438a1fe805b309b097c323142719ec8a5b
redis-port: 6379
redis-storage-managed: true
redis-backup-r2-bucket: redis-aws-fixture-backup
redis-backup-r2-endpoint: https://s3.us-east-1.amazonaws.com
redis-backup-r2-region: us-east-1
redis-backup-oncalendar: "*-*-* 00/6:00:00"
redis-backup-retention-days: 7
redis-backup-max-age-hours: 8
aws-region: us-east-1
aws-availability-zone: us-east-1a
aws-image-id: ami-025d99823a4caad37
aws-instance-type: t3.small
aws-vpc-cidr: 10.79.0.0/16
aws-subnet-cidr: 10.79.1.0/24
aws-root-volume-size-gb: 20
redis-ssh-sources:
  - 0.0.0.0/0
s3-bucket: redis-aws-fixture-state
s3-region: us-east-1
s3-bucket-mode: managed
