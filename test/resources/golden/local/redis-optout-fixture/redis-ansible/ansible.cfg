[defaults]
stdout_callback = default
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True
# Ubuntu 24.04 runs unattended-upgrades minutes after first boot (the
# apt-daily-upgrade timer fired 6 minutes in on the redis-vultr build) and a
# library sshd links -- libpam, libssl -- restarts sshd when upgraded. A play
# whose first connection lands in that second sees `kex_exchange_identification:
# read: Connection reset by peer` and reports the host UNREACHABLE. Three
# attempts ride it out; the cleanup and rehearsal plays also wait for the
# connection first.
retries = 3
