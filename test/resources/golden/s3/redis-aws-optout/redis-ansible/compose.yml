# Redis 7.2 on loopback, nowhere else. The configuration file carries the
# password so that neither the command line nor the container environment
# does; the healthcheck reads it from that file.
#
# Exposure is decided here, by what is published: inside the container Redis
# binds every interface, and the one host binding — 127.0.0.1 — is the whole
# of what can reach it. No private network: a single-node package creates
# none (Compute Provider Standard §5), and the supported client path is an
# SSH tunnel to this loopback port.
name: redis
services:
  redis:
    image: docker.io/library/redis:7.2.16@sha256:74566c6910d13ae61e7ce73ebd3127438a1fe805b309b097c323142719ec8a5b
    restart: unless-stopped
    command: ["redis-server", "/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /opt/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$(sed -n 's/^requirepass //p' /etc/redis/redis.conf)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
volumes:
  # The append-only file and the periodic RDB live here; a restart keeps them,
  # and the smoke gate proves it on every converge.
  redis-data:
