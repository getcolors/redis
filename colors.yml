# Example desired state for a redis deployment. Non-secret values only.
# Credentials belong in the gitignored .envrc.private as COLORS_PAR_* variables.
# Never export COLORS_PAR_PROFILE: it selects this deployment's remote state.
#
# Required credentials (the compute one follows provider-compute):
#   Vultr            COLORS_PAR_VULTR_API_KEY
#   DigitalOcean     COLORS_PAR_DO_TOKEN
#   state in R2      COLORS_PAR_R2_ACCESS_KEY_ID
#                    COLORS_PAR_R2_SECRET_ACCESS_KEY
#                    (the tofu-state bucket; reaches no host)
#   backups in R2    COLORS_PAR_REDIS_BACKUP_R2_ACCESS_KEY_ID
#                    COLORS_PAR_REDIS_BACKUP_R2_SECRET_ACCESS_KEY
#                    (Object Read & Write on the backup bucket ONLY; the one
#                    pair that reaches the host)
#
# There is no DNS provider and no public Redis port: Redis is published on
# loopback only, the firewall opens 22 alone, and the client path is an SSH
# tunnel (ssh -L 6379:127.0.0.1:6379 <profile>). No private network is
# created on any provider (workspace standards/compute-provider.md). The
# password is generated on the server during convergence (create-once at
# /etc/redis/secrets/password) and is never operator-supplied.

profile: redis-example
workdir: .colors

# vultr or digitalocean. Switching on a profile that already holds a machine
# is refused: set it back, delete, then create on the new provider.
provider-compute: vultr
provider-backend: r2

# Preserve this guard in committed desired state. Destruction requires an
# explicitly authorized one-run override; never edit this flag to bypass it.
compute-prevent-destroy: true

# --- Redis --------------------------------------------------------------------

# Redis 7.2, pinned by digest: Docker Hub republishes the 7.2 and 7.2.16 tags
# whenever the base image is rebuilt, so a tag alone does not pin bytes.
# The server runs with maxmemory-policy noeviction (a full memory is an error
# to the writer, never a silently dropped key) and an append-only file with
# appendfsync everysec on a named volume, so a restart keeps every
# acknowledged write older than about a second.
redis-image: docker.io/library/redis:7.2.16@sha256:74566c6910d13ae61e7ce73ebd3127438a1fe805b309b097c323142719ec8a5b
# The port published on 127.0.0.1 of the host, and nowhere else.
redis-port: 6379

# --- Backups in R2 ------------------------------------------------------------

# RDB snapshot sets under <profile>/redis/<stamp>/ in the backup bucket, each
# with a completion protocol (snapshot -> verified -> manifest -> .complete;
# restore picks only completed sets). The snapshot is streamed from the
# server over the replication protocol and checked with redis-check-rdb
# before it counts. The bucket must already exist: the scoped token cannot
# create buckets. `./green rehearse` restores the newest set into a scratch
# instance of the pinned image and reads the smoke key back from it.
redis-backup-r2-bucket: redis-backup
redis-backup-r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
redis-backup-r2-region: auto
redis-backup-oncalendar: "*-*-* 00/6:00:00"
redis-backup-retention-days: 7
# A newest completed set older than this fails the monitor (and `describe`).
redis-backup-max-age-hours: 8

# --- Vultr (read when provider-compute: vultr) -------------------------------

# No vultr-name: per workspace standards/compute-name.md the machine and its
# firewall group are named after the profile.
vultr-region: ams
# 1 vCPU / 2 GiB: Redis is single-threaded and this is a cache/queue tier.
vultr-plan: vc2-1c-2gb
# Vultr operating systems are numeric ids; 2284 is Ubuntu 24.04 LTS x64.
vultr-os-id: 2284

# No vultr-ssh-keys: keygen mode per workspace standards/ssh-keypair.md. The
# package generates and owns ~/.ssh/<profile> and registers the account key
# resource named after the profile. Setting vultr-ssh-keys here would switch
# this deployment to opt-out mode.

# SSH is the only open port: convergence, recovery, and the supported client
# path (the tunnel) all ride it.
vultr-ssh-sources:
  - 0.0.0.0/0
  - "::/0"

# --- DigitalOcean (read when provider-compute: digitalocean) -----------------

# The same deployment on a droplet: keep both blocks and switch providers by
# editing provider-compute alone; the unselected block is ignored. The droplet
# joins the region's default VPC, which is discovered, never created — a
# digitalocean-vpc-uuid or digitalocean-vpc-cidr key is refused.
# digitalocean-region: ams3
# digitalocean-size: s-1vcpu-2gb
# digitalocean-image: ubuntu-24-04-x64
# digitalocean-ssh-sources:
#   - 0.0.0.0/0
#   - "::/0"
# No digitalocean-name and no digitalocean-ssh-keys, for the same reasons as
# their Vultr counterparts.

# --- OpenTofu state backend ---------------------------------------------------

r2-bucket: tofu-state-319271fed8bc6d2d9059362be1165f37-eu
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
